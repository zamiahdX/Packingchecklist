<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>行李打包清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233F;
    --ink-text:#233250;
    --ink-mute:#6b7690;
    --paper:#EEF1E9;
    --card:#FFFFFF;
    --line:#DEE3D9;
    --line-strong:#C7CFC2;
    --teal:#0E7C66;
    --teal-soft:#E1F0EA;
    --gold:#D9A23B;
    --gold-soft:#FBF0D9;
    --brick:#B23B3B;
    --brick-soft:#F7E3E1;
    --navy-soft:#E7EAF3;
    --sc-abroad:#7B5EA7;   --sc-abroad-soft:#EFE9F5;
    --sc-drive:#2E8B6F;    --sc-drive-soft:#E1F0E9;
    --sc-beach:#3D7EBF;    --sc-beach-soft:#E4EEF8;
    --sc-camp:#8C6239;     --sc-camp-soft:#F1E7DB;
    --sc-baby:#C15C8B;     --sc-baby-soft:#F8E7EF;
    --st-carry:#B23B3B;    --st-carry-soft:#F7E3E1;
    --st-case:#2C4A7C;     --st-case-soft:#E4EAF5;
    --st-car:#0E7C66;      --st-car-soft:#E1F0EA;
    --radius-lg:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink-text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .shell{max-width:560px;margin:0 auto;position:relative;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;}

  /* ---------- Header ---------- */
  .pass{
    background:var(--ink);color:#F4F2E8;
    padding:calc(18px + env(safe-area-inset-top)) 20px 0 20px;
    position:sticky;top:0;z-index:40;box-shadow:0 6px 18px rgba(22,35,63,0.18);
  }
  .pass-top{
    display:flex;align-items:center;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:#B9C2DD;
  }
  .pass-brand{display:flex;align-items:center;gap:7px;color:#F4F2E8;font-weight:600;}
  .pass-brand .plane{font-size:14px;transform:rotate(45deg);display:inline-block;}
  .pass-route{margin-top:12px;display:flex;align-items:baseline;gap:10px;}
  .trip-name{
    background:transparent;border:none;border-bottom:1px dashed #4C5A78;color:#F4F2E8;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:.02em;
    padding:2px 0 6px 0;width:100%;outline:none;
  }
  .trip-name::placeholder{color:#7C88A6;}
  .trip-name:focus{border-bottom-color:var(--gold);}
  .pass-stats{margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;}
  .stat-num{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:#F4F2E8;white-space:nowrap;}
  .stat-label{font-size:10px;color:#9FAAC7;letter-spacing:.08em;display:block;margin-top:1px;}
  .progress-track{height:6px;background:#2A3A5C;border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#F0C878);border-radius:99px;transition:width .35s ease;}
  .stat-pct{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--gold);min-width:34px;text-align:right;}
  .shared-note{margin-top:10px;font-size:10.5px;color:#9FAAC7;display:flex;align-items:center;gap:6px;}
  .shared-note .dot{
    width:6px;height:6px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 0 3px rgba(14,124,102,.25);flex:0 0 auto;
  }
  .shared-note .dot.warn{background:var(--gold);box-shadow:0 0 0 3px rgba(217,162,59,.25);}
  .shared-note .dot.err{background:var(--brick);box-shadow:0 0 0 3px rgba(178,59,59,.25);}
  .perforation{
    margin-top:14px;height:14px;
    background-image:radial-gradient(circle 7px, var(--paper) 7px, transparent 7.5px);
    background-size:22px 14px;background-position:center top;background-repeat:repeat-x;position:relative;
  }
  .perforation::before{content:"";position:absolute;top:6px;left:0;right:0;border-top:1px dashed #445071;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;padding:14px 20px 0 20px;}
  .tab{
    flex:1;border:1px solid var(--line-strong);background:var(--card);border-radius:99px;
    padding:10px 12px;font-size:14.5px;font-weight:700;color:var(--ink-mute);
    display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  }
  .tab .tab-count{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;color:var(--ink-mute);
    background:var(--navy-soft);padding:2px 6px;border-radius:99px;
  }
  .tab.active{background:var(--ink);border-color:var(--ink);color:#F4F2E8;}
  .tab.active .tab-count{background:#2A3A5C;color:#F4F2E8;}

  /* ---------- Filters ---------- */
  .filters{padding:14px 0 4px 0;}
  .chip-row{
    display:flex;gap:8px;overflow-x:auto;padding:0 20px 4px 20px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1px solid var(--line-strong);background:var(--card);color:var(--ink-text);
    border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;
    cursor:pointer;display:flex;align-items:center;gap:5px;
  }
  .chip.active{color:#fff;border-color:transparent;}
  .filter-caption{padding:2px 20px 0 20px;font-size:11px;color:var(--ink-mute);}
  .toggle-row{display:flex;align-items:center;gap:8px;padding:10px 20px 0 20px;flex-wrap:wrap;}
  .toggle-btn{
    border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:8px 11px;
    font-size:12.5px;font-weight:600;color:var(--ink-mute);cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .toggle-btn.active{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .toggle-btn.star.active{background:var(--gold-soft);border-color:var(--gold);color:#9A6E12;}
  .row-label{font-size:11px;font-weight:700;color:var(--ink-mute);letter-spacing:.02em;}
  .segmented{margin-left:auto;display:flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;}
  .seg-btn{border:none;background:var(--card);padding:8px 11px;font-size:12.5px;font-weight:600;color:var(--ink-mute);cursor:pointer;}
  .seg-btn+.seg-btn{border-left:1px solid var(--line-strong);}
  .seg-btn.active{background:var(--ink);color:#F4F2E8;}

  /* ---------- List ---------- */
  main{padding:16px 16px 12px 16px;}
  .group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;}
  .group-header{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;}
  .group-icon{font-size:18px;line-height:1;}
  .group-title{font-weight:700;font-size:14.5px;flex:1;}
  .group-count{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--ink-mute);
    background:var(--paper);padding:3px 8px;border-radius:99px;
  }
  .group-chev{font-size:11px;color:var(--ink-mute);transition:transform .2s ease;}
  .group.collapsed .group-chev{transform:rotate(-90deg);}
  .group-items{border-top:1px solid var(--line);}
  .group.collapsed .group-items{display:none;}

  .item{display:flex;align-items:flex-start;gap:9px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item-check{position:relative;flex:0 0 auto;width:24px;height:24px;margin-top:1px;cursor:pointer;}
  .item-check input{position:absolute;opacity:0;width:24px;height:24px;margin:0;cursor:pointer;}
  .check-mark{
    position:absolute;inset:0;border-radius:50%;border:2px solid var(--line-strong);
    background:var(--card);display:flex;align-items:center;justify-content:center;
  }
  .check-mark::after{
    content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
    transform:rotate(-45deg) translateY(-1px);opacity:0;
  }
  .item-check input:checked + .check-mark{background:var(--teal);border-color:var(--teal);}
  .item-check input:checked + .check-mark::after{opacity:1;}
  .item-check input:focus-visible + .check-mark{outline:2px solid var(--gold);outline-offset:2px;}

  .item-body{flex:1;min-width:0;}
  .item-name-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
  .item-name{font-size:14.5px;font-weight:600;color:var(--ink-text);}
  .item.packed .item-name{color:var(--ink-mute);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .must-flag{font-size:10px;font-weight:700;color:var(--brick);background:var(--brick-soft);padding:2px 6px;border-radius:5px;letter-spacing:.03em;}
  .trip-flag{font-size:10px;font-weight:700;color:#9A6E12;background:var(--gold-soft);padding:2px 6px;border-radius:5px;letter-spacing:.03em;}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:2.5px 7px;
    border-radius:6px;display:inline-flex;align-items:center;gap:4px;
  }
  .item-note{font-size:12px;color:var(--ink-mute);margin-top:5px;line-height:1.45;}
  .item.packed{opacity:.62;}
  .edit-btn{
    flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-mute);font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .edit-btn:active{background:var(--navy-soft);}

  .empty-state{text-align:center;padding:46px 20px;color:var(--ink-mute);}
  .empty-state .emoji{font-size:30px;display:block;margin-bottom:10px;}
  .empty-state p{margin:0;font-size:13.5px;line-height:1.6;}
  .empty-add-btn{
    margin-top:14px;border:1px solid var(--teal);color:var(--teal);background:var(--teal-soft);
    padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
  }

  /* ---------- Footer ---------- */
  footer{padding:4px 20px calc(110px + env(safe-area-inset-bottom)) 20px;}
  .footer-actions{display:flex;gap:10px;margin-bottom:10px;}
  .foot-btn{
    flex:1;border:1px solid var(--line-strong);color:var(--ink-text);background:var(--card);
    padding:11px 12px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .foot-btn.danger{border-color:var(--brick);color:var(--brick);}
  .foot-btn.confirming{background:var(--brick);border-color:var(--brick);color:#fff;}
  .storage-box{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-top:6px;
  }
  .storage-title{font-size:12px;font-weight:700;color:var(--ink-text);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
  .storage-desc{font-size:11.5px;color:var(--ink-mute);line-height:1.65;}
  .credit{margin:12px 0 0 0;font-size:11px;color:var(--ink-mute);line-height:1.6;text-align:center;}
  .hint{font-size:11px;color:var(--ink-mute);margin:6px 0 0 0;}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(90px + env(safe-area-inset-bottom));
    background:var(--ink);color:#F4F2E8;padding:10px 16px;border-radius:99px;
    font-size:12.5px;font-weight:600;z-index:120;opacity:0;pointer-events:none;
    transition:opacity .25s ease;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:calc(20px + env(safe-area-inset-right));
    bottom:calc(22px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:50%;background:var(--ink);color:#F4F2E8;border:none;
    font-size:26px;line-height:1;box-shadow:0 10px 22px rgba(22,35,63,0.35);
    cursor:pointer;z-index:45;display:flex;align-items:center;justify-content:center;
  }
  .fab:active{transform:scale(0.94);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,26,38,0.46);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-sheet{
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--card);
    border-radius:22px 22px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom)) 20px;
    transform:translateY(16px);transition:transform .22s ease;-webkit-overflow-scrolling:touch;
  }
  .modal-overlay.open .modal-sheet{transform:translateY(0);}
  .modal-handle{width:36px;height:4px;background:var(--line-strong);border-radius:99px;margin:0 auto 14px auto;}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .modal-close{border:none;background:var(--paper);width:30px;height:30px;border-radius:50%;color:var(--ink-mute);font-size:15px;cursor:pointer;}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-mute);margin-bottom:6px;letter-spacing:.02em;}
  .field input[type="text"], .field textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;
    font-size:16px;color:var(--ink-text);background:var(--paper);outline:none;resize:vertical;
  }
  .field input[type="text"]:focus, .field textarea:focus{border-color:var(--teal);}
  .field textarea{min-height:56px;}
  .field-sub{font-size:11px;color:var(--ink-mute);margin-top:6px;line-height:1.5;}

  .seg-field{display:flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;}
  .seg-field button{
    flex:1;border:none;background:var(--card);padding:10px 8px;font-size:13.5px;font-weight:600;
    color:var(--ink-mute);cursor:pointer;
  }
  .seg-field button+button{border-left:1px solid var(--line-strong);}
  .seg-field button.active{background:var(--ink);color:#F4F2E8;}

  .toggle-field{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .switch{
    width:44px;height:26px;border-radius:99px;background:var(--line-strong);position:relative;
    border:none;cursor:pointer;flex:0 0 auto;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:left .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch.on{background:var(--teal);}
  .switch.on::after{left:21px;}
  .switch.gold.on{background:var(--gold);}

  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;border:none;border-radius:11px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--ink);color:#F4F2E8;}
  .btn-secondary{background:var(--paper);color:var(--ink-text);}
  .btn-danger-outline{background:var(--brick-soft);color:var(--brick);}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="shell">

  <header class="pass">
    <div class="pass-top">
      <div class="pass-brand"><span class="plane">✈</span><span>PACKING PASS</span></div>
      <div class="pass-scope" id="versionTag">v4</div>
    </div>
    <div class="pass-route">
      <input id="tripName" class="trip-name" placeholder="台北 → 目的地" maxlength="40">
    </div>
    <div class="pass-stats">
      <div><span class="stat-num" id="overallCount">0/0</span><span class="stat-label">全部已打包</span></div>
      <div class="progress-track"><div class="progress-fill" id="overallFill"></div></div>
      <div class="stat-pct" id="overallPct">0%</div>
    </div>
    <div class="shared-note"><span class="dot" id="statusDot"></span><span id="statusText">載入中…</span></div>
    <div class="perforation"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-cat="adult">大人 <span class="tab-count" id="countAdult">0/0</span></button>
    <button class="tab" data-cat="child">小孩 <span class="tab-count" id="countChild">0/0</span></button>
  </nav>

  <section class="filters">
    <div class="chip-row" id="scenarioChips"></div>
    <p class="filter-caption">依行程情境篩選（可複選）；沒有標情境的是任何行程都要帶的基本款</p>
    <div class="toggle-row">
      <button class="toggle-btn" id="mustToggle">⚑ 只看必帶</button>
      <button class="toggle-btn" id="unpackedToggle">◻ 只看未打包</button>
      <button class="toggle-btn star" id="defaultToggle">★ 只看預設</button>
    </div>
    <div class="toggle-row">
      <span class="row-label">分組方式</span>
      <div class="segmented" id="groupBySeg">
        <button class="seg-btn active" data-mode="group">依分組</button>
        <button class="seg-btn" data-mode="storage">依收納</button>
      </div>
    </div>
    <p class="hint">★ 預設項目會跨行程保留・☆ 本次行程項目只用於這趟</p>
  </section>

  <main id="list"></main>

  <footer>
    <div class="footer-actions">
      <button class="foot-btn" id="resetBtn">重置打包狀態</button>
      <button class="foot-btn danger" id="newTripBtn">開始新行程</button>
    </div>
    <div class="footer-actions">
      <button class="foot-btn" id="exportBtn">匯出備份</button>
      <button class="foot-btn" id="importBtn">匯入備份</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">

    <div class="storage-box">
      <div class="storage-title" id="storageTitle">儲存方式</div>
      <div class="storage-desc" id="storageDesc"></div>
    </div>

    <p class="credit">
      整理自 Notion「🧳 行李清單模板（通用）」<br>
      <span id="defaultSummary"></span>
    </p>
  </footer>

</div>

<button class="fab" id="fabAdd" aria-label="新增項目">+</button>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <div class="modal-title">
      <span id="modalTitleText">新增項目</span>
      <button class="modal-close" id="modalClose" aria-label="關閉">✕</button>
    </div>

    <div class="field">
      <label for="fName">項目名稱</label>
      <input type="text" id="fName" maxlength="60" placeholder="例如：折疊傘">
    </div>

    <div class="field toggle-field">
      <div>
        <label style="margin-bottom:4px;">設為預設項目</label>
        <div class="field-sub" id="defaultHint">開啟後，「開始新行程」時會保留這個項目</div>
      </div>
      <button class="switch gold" id="fDefault" aria-label="設為預設項目"></button>
    </div>

    <div class="field">
      <label>類別</label>
      <div class="seg-field" id="fCat">
        <button data-value="adult" class="active">大人</button>
        <button data-value="child">小孩</button>
      </div>
    </div>

    <div class="field">
      <label for="fGroup">分組</label>
      <input type="text" id="fGroup" list="groupOptions" maxlength="20" placeholder="例如：證件與財物（可自訂新分組）">
      <datalist id="groupOptions"></datalist>
    </div>

    <div class="field">
      <label>收納位置</label>
      <div class="seg-field" id="fStorage">
        <button data-value="carry" class="active">🎒 隨身</button>
        <button data-value="case">🧳 行李箱</button>
        <button data-value="car">🚙 車上</button>
      </div>
    </div>

    <div class="field toggle-field">
      <label style="margin-bottom:0;">必帶（漏了會直接影響行程）</label>
      <button class="switch" id="fMust" aria-label="必帶"></button>
    </div>

    <div class="field">
      <label>適用情境（可複選，不選＝任何行程都要帶）</label>
      <div class="chip-row" id="fScenarios" style="padding:0 0 4px 0;"></div>
    </div>

    <div class="field">
      <label for="fNote">備註（選填）</label>

  //  儲存層：自動偵測可用的儲存方式
  //   cloud    → Firebase Realtime DB（多裝置共用）＋ 本機快取
  //   local    → localStorage（GitHub Pages 上的預設，重新整理不會消失）
  //   artifact → Claude 內建 window.storage（在 Claude 預覽時使用）
  //   memory   → 上述都不可用（例如無痕模式擋住儲存）時的最後退路
  // ==========================================================================
  const Store = {
    mode:'memory',
    lsOK:false,
    cloudOK:null,
    memory:{},

    detect(){
      try{
        const probe = '__packing_probe__';
        localStorage.setItem(probe,'1');
        localStorage.removeItem(probe);
        this.lsOK = true;
      }catch(e){ this.lsOK = false; }

      const hasArtifact = !!(window.storage && typeof window.storage.get==='function');

      if(CLOUD.enabled && CLOUD.url) this.mode = 'cloud';
      else if(hasArtifact)           this.mode = 'artifact';
      else if(this.lsOK)             this.mode = 'local';
      else                           this.mode = 'memory';
      return this.mode;
    },

    cloudUrl(){
      return CLOUD.url.replace(/\/+$/,'') + '/packing/' + encodeURIComponent(CLOUD.room) + '.json';
    },

    lsGet(key){ if(!this.lsOK) return this.memory[key] || null; try{ return localStorage.getItem(key); }catch(e){ return null; } },
    lsSet(key,val){
      this.memory[key] = val;
      if(!this.lsOK) return false;
      try{ localStorage.setItem(key,val); return true; }catch(e){ return false; }
    },

    async readShared(){
      if(this.mode==='cloud'){
        try{
          const res = await fetch(this.cloudUrl(), {cache:'no-store'});
          if(res.ok){
            const data = await res.json();
            this.cloudOK = true;
            if(data){ this.lsSet(LS_SHARED, JSON.stringify(data)); return data; }
            // 雲端還沒資料 → 用本機的（稍後會推上去）
          }else{ this.cloudOK = false; }
        }catch(e){ this.cloudOK = false; }
      }
      if(this.mode==='artifact'){
        try{
          const res = await window.storage.get(ART_SHARED, true);
          if(res && res.value) return JSON.parse(res.value);
        }catch(e){}
        return null;
      }
      const raw = this.lsGet(LS_SHARED);
      if(!raw) return null;
      try{ return JSON.parse(raw); }catch(e){ return null; }
    },

    async writeShared(obj){
      const payload = JSON.stringify(obj);
      this.lsSet(LS_SHARED, payload);           // 一律先寫本機，確保重新整理不會消失
      if(this.mode==='cloud'){
        try{
          const res = await fetch(this.cloudUrl(), {
            method:'PUT', headers:{'Content-Type':'application/json'}, body:payload
          });
          this.cloudOK = res.ok;
          return res.ok;
        }catch(e){ this.cloudOK = false; return false; }
      }
      if(this.mode==='artifact'){
        try{ await window.storage.set(ART_SHARED, payload, true); return true; }catch(e){ return false; }
      }
      return this.lsOK;
    },

    async readView(){
      if(this.mode==='artifact'){
        try{
          const res = await window.storage.get(ART_VIEW, false);
          if(res && res.value) return JSON.parse(res.value);
        }catch(e){}
        return null;
      }
      const raw = this.lsGet(LS_VIEW);
      if(!raw) return null;
      try{ return JSON.parse(raw); }catch(e){ return null; }
    },

    async writeView(obj){
      const payload = JSON.stringify(obj);
      if(this.mode==='artifact'){
        try{ await window.storage.set(ART_VIEW, payload, false); }catch(e){}
        return;
      }
      this.lsSet(LS_VIEW, payload);
    },
  };

  // ---------- State ----------
  const state = {
    items: [], packed: {}, tripName:'', seeded: [], updatedAt: 0,
    activeTab:'adult', scenarios:new Set(),
    mustOnly:false, unpackedOnly:false, defaultOnly:false,
    groupBy:'group', collapsed:{},
  };

  let modalOpen = false;
  let modalMode = 'add';
  let editingId = null;
  let formScenarios = new Set();

  // ---------- 資料升級（不重製、不覆蓋）----------
  function baselineItem(b){ return {...b, scenarios:[...b.scenarios], isDefault:true}; }

  function migrate(data){
    const items = Array.isArray(data.items) ? data.items.map(it=>({...it})) : [];
    items.forEach(it=>{
      if(typeof it.isDefault !== 'boolean') it.isDefault = true;
      if(!Array.isArray(it.scenarios)) it.scenarios = [];
      if(typeof it.order !== 'number') it.order = 99000;
    });

    let seeded = Array.isArray(data.seeded) ? data.seeded.slice() : BASELINE.map(b=>b.id);
    const seenIds = new Set(items.map(i=>i.id));
    const seededSet = new Set(seeded);

    let added = 0;
    BASELINE.forEach(b=>{
      if(!seededSet.has(b.id) && !seenIds.has(b.id)){ items.push(baselineItem(b)); added++; }
      if(!seededSet.has(b.id)){ seeded.push(b.id); seededSet.add(b.id); }
    });

    return {
      items,
      packed: data.packed || {},
      tripName: typeof data.tripName==='string' ? data.tripName : '',
      seeded,
      updatedAt: typeof data.updatedAt==='number' ? data.updatedAt : 0,
      dataVersion: typeof data.v==='number' ? data.v : 0,
      added,
    };
  }

  // ---------- Elements ----------
  const el = {};
  ['tripName','versionTag','overallCount','overallFill','overallPct','statusDot','statusText',
   'tabs','countAdult','countChild','scenarioChips','mustToggle','unpackedToggle','defaultToggle',
   'groupBySeg','list','resetBtn','newTripBtn','exportBtn','importBtn','importFile',
   'storageTitle','storageDesc','defaultSummary','toast','fabAdd','modalOverlay','modalTitleText',
   'modalClose','fName','fDefault','defaultHint','fCat','fGroup','groupOptions','fStorage','fMust',
   'fScenarios','fNote','fSave','fCancel','fDelete','deleteRow'
  ].forEach(id=>{ el[id] = document.getElementById(id); });

  // ---------- Helpers ----------
  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function uid(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function countTotal(cat){ return state.items.filter(d=>d.cat===cat).length; }
  function countPacked(cat){ return state.items.filter(d=>d.cat===cat && state.packed[d.id]).length; }

  let toastTimer = null;
  function toast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.toast.classList.remove('show'), 2200);
  }

  function getGroupOrder(cat){
    const base = GROUP_ORDER_BASE[cat] || [];
    const present = Array.from(new Set(state.items.filter(i=>i.cat===cat).map(i=>i.group)));
    const extra = present.filter(g=>!base.includes(g)).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    return [...base, ...extra];
  }

  function getFilteredItems(cat){
    return state.items.filter(it=>it.cat===cat)
      .filter(it=> !state.mustOnly || it.must)
      .filter(it=> !state.unpackedOnly || !state.packed[it.id])
      .filter(it=> !state.defaultOnly || it.isDefault)
      .filter(it=>{
        if(state.scenarios.size===0) return true;
        if(!it.scenarios || it.scenarios.length===0) return true;
        return it.scenarios.some(s=>state.scenarios.has(s));
      })
      .sort((a,b)=>a.order-b.order);
  }

  function groupItems(items, mode, cat){
    const map = new Map();
    const order = mode==='group' ? getGroupOrder(cat) : STORAGE_ORDER;
    order.forEach(k=>map.set(k,[]));
    items.forEach(it=>{
      const key = mode==='group' ? it.group : it.storage;
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(it);
    });
    return map;
  }

  // ---------- Save ----------
  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 300);
  }
  async function doSave(){
    state.updatedAt = Date.now();
    const ok = await Store.writeShared({
      v: APP_VERSION,
      updatedAt: state.updatedAt,
      items: state.items,
      packed: state.packed,
      tripName: state.tripName,
      seeded: state.seeded,
    });
    if(!ok && Store.mode==='cloud') renderStorageBox();
  }

  let saveViewTimer = null;
  function scheduleSaveView(){
    clearTimeout(saveViewTimer);
    saveViewTimer = setTimeout(()=>{
      Store.writeView({
        activeTab:state.activeTab,
        scenarios:Array.from(state.scenarios),
        mustOnly:state.mustOnly,
        unpackedOnly:state.unpackedOnly,
        defaultOnly:state.defaultOnly,
        groupBy:state.groupBy,
      });
    }, 300);
  }

  // ---------- Render ----------
  function renderChips(container, selectedSet, onToggle){
    container.innerHTML = SCENARIO_ORDER.map(key=>{
      const meta = SCENARIO_META[key];
      const active = selectedSet.has(key);
      const style = active ? `background:var(${meta.var});` : `color:var(${meta.var});`;
      return `<button type="button" class="chip${active?' active':''}" data-scenario="${key}" style="${style}">${meta.icon} ${meta.label}</button>`;
    }).join('');
    container.onclick = (e)=>{
      const btn = e.target.closest('.chip');
      if(btn) onToggle(btn.dataset.scenario);
    };
  }

  function renderList(){
    const cat = state.activeTab;
    const items = getFilteredItems(cat);
    const grouped = groupItems(items, state.groupBy, cat);

    let html = '', anyItems = false;

    grouped.forEach((arr, key)=>{
      if(arr.length===0) return;
      anyItems = true;
      const isGroupMode = state.groupBy==='group';
      const icon = isGroupMode ? (GROUP_META[key]?.icon || '📦') : STORAGE_META[key].icon;
      const title = isGroupMode ? key : STORAGE_META[key].label;
      const packedCount = arr.filter(it=>state.packed[it.id]).length;
      const collKey = cat+'|'+state.groupBy+'|'+key;
      const collapsed = !!state.collapsed[collKey];

      html += `<div class="group${collapsed?' collapsed':''}">
        <div class="group-header" data-toggle-key="${esc(collKey)}">
          <span class="group-icon">${icon}</span>
          <span class="group-title">${esc(title)}</span>
          <span class="group-count">${packedCount}/${arr.length}</span>
          <span class="group-chev">▾</span>
        </div>
        <div class="group-items">`;

      arr.forEach(it=>{
        const packed = !!state.packed[it.id];
        const st = STORAGE_META[it.storage] || STORAGE_META.case;
        let badges = `<span class="badge" style="background:var(${st.soft});color:var(${st.var})">${st.icon} ${st.label}</span>`;
        (it.scenarios||[]).forEach(s=>{
          const sm = SCENARIO_META[s];
          if(sm) badges += `<span class="badge" style="background:var(${sm.soft});color:var(${sm.var})">${sm.icon} ${sm.label}</span>`;
        });
        html += `<div class="item${packed?' packed':''}">
          <label class="item-check">
            <input type="checkbox" data-id="${it.id}" ${packed?'checked':''}>
            <span class="check-mark"></span>
          </label>
          <div class="item-body">
            <div class="item-name-row">
              <span class="item-name">${esc(it.name)}</span>
              ${it.must?'<span class="must-flag">必帶</span>':''}
              ${it.isDefault?'':'<span class="trip-flag">☆ 本次行程</span>'}
            </div>
            <div class="badge-row">${badges}</div>
            ${it.note?`<div class="item-note">${esc(it.note)}</div>`:''}
          </div>
          <button class="edit-btn" data-edit-id="${it.id}" aria-label="編輯項目">✎</button>
        </div>`;
      });

      html += `</div></div>`;
    });

    if(!anyItems){
      const noneInTab = state.items.filter(i=>i.cat===cat).length===0;
      html = `<div class="empty-state">
        <span class="emoji">🧳</span>
        <p>${noneInTab ? '這個分頁還沒有項目' : '沒有符合目前篩選條件的項目<br>試試取消一些情境標籤或開關'}</p>
        <button class="empty-add-btn" id="emptyAddBtn">＋ 新增項目</button>
      </div>`;
    }

    el.list.innerHTML = html;
    const b = document.getElementById('emptyAddBtn');
    if(b) b.addEventListener('click', ()=>openModal('add'));
  }

  function renderStats(){
    const total = state.items.length;
    const packed = state.items.filter(d=>state.packed[d.id]).length;
    const pct = total? Math.round(packed/total*100) : 0;
    el.overallCount.textContent = `${packed}/${total}`;
    el.overallFill.style.width = pct+'%';
    el.overallPct.textContent = pct+'%';
    el.countAdult.textContent = `${countPacked('adult')}/${countTotal('adult')}`;
    el.countChild.textContent = `${countPacked('child')}/${countTotal('child')}`;

    const defCount = state.items.filter(i=>i.isDefault).length;
    el.defaultSummary.textContent =
      `目前 ${total} 項：★ 預設 ${defCount} 項、☆ 本次行程 ${total-defCount} 項・版本 v${APP_VERSION}`;
  }

  function renderStorageBox(){
    const m = Store.mode;
    let dotClass = '', statusText = '', title = '', desc = '';

    if(m==='cloud'){
      const ok = Store.cloudOK;
      dotClass = ok===false ? 'err' : '';
      statusText = ok===false ? '雲端連線失敗・暫存在這台裝置' : `雲端同步中・房間 ${CLOUD.room}`;
      title = '☁️ 雲端同步（多裝置共用）';
      desc = ok===false
        ? '目前連不上雲端資料庫，變更會先存在這台裝置，恢復連線後再按任一項目即可推上雲端。請確認 CLOUD.url 與資料庫規則設定正確。'
        : '所有裝置共用同一份清單，約每 7 秒同步一次。提醒：知道網址與房間名稱的人都能讀寫這份清單。';
    }else if(m==='artifact'){
      dotClass = '';
      statusText = 'Claude 內建儲存・預覽模式';
      title = '🧪 Claude 預覽環境';
      desc = '目前在 Claude 預覽中使用內建儲存。上傳到 GitHub Pages 後會自動改用瀏覽器 localStorage，重新整理不會再被初始化。';
    }else if(m==='local'){
      dotClass = 'warn';
      statusText = '已存在這台裝置・不跨裝置同步';
      title = '📱 本機儲存（localStorage）';
      desc = '修改會存在這支手機/電腦的瀏覽器裡，重新整理與關閉分頁都不會消失。但換裝置、換瀏覽器或清除瀏覽資料就會不見，建議定期「匯出備份」。'
           + ' iOS Safari 若超過 7 天沒開啟可能自動清除，把網頁「加入主畫面」可大幅降低這個風險。'
           + ' 想要多裝置共用，請看檔案最上方 CLOUD 設定說明。';
    }else{
      dotClass = 'err';
      statusText = '無法儲存・離開頁面後會遺失';
      title = '⚠️ 無法使用瀏覽器儲存';
      desc = '瀏覽器擋住了本機儲存（常見於無痕模式或阻擋 Cookie 的設定）。請改用一般瀏覽模式，或隨時用「匯出備份」保存資料。';
    }

    el.statusDot.className = 'dot ' + dotClass;
    el.statusText.textContent = statusText;
    el.storageTitle.textContent = title;
    el.storageDesc.textContent = desc;
  }

  function renderToggles(){
    el.mustToggle.classList.toggle('active', state.mustOnly);
    el.unpackedToggle.classList.toggle('active', state.unpackedOnly);
    el.defaultToggle.classList.toggle('active', state.defaultOnly);
    el.groupBySeg.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===state.groupBy));
    el.tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.cat===state.activeTab));
  }

  function render(){
    renderChips(el.scenarioChips, state.scenarios, (key)=>{
      if(state.scenarios.has(key)) state.scenarios.delete(key); else state.scenarios.add(key);
      scheduleSaveView();
      render();
    });
    renderToggles();
    renderStats();
    renderStorageBox();
    renderList();
  }

  // ---------- Modal ----------
  function populateGroupOptions(cat){
    el.groupOptions.innerHTML = getGroupOrder(cat).map(g=>`<option value="${esc(g)}"></option>`).join('');
  }
  function setSegActive(container, value){
    container.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.value===value));
  }
  function getSegActive(container){
    const btn = container.querySelector('button.active');
    return btn ? btn.dataset.value : null;
  }
  function bindScenarioChips(){
    renderChips(el.fScenarios, formScenarios, (key)=>{
      if(formScenarios.has(key)) formScenarios.delete(key); else formScenarios.add(key);
      bindScenarioChips();
    });
  }
  function updateDefaultHint(){
    el.defaultHint.textContent = el.fDefault.classList.contains('on')
      ? '★ 預設項目：「開始新行程」時會保留下來'
      : '☆ 本次行程項目：「開始新行程」時會一併清掉';
  }

  function openModal(mode, itemId){
    modalMode = mode; editingId = itemId || null; modalOpen = true;
    let item = null;
    if(mode==='edit'){
      item = state.items.find(i=>i.id===itemId);
      if(!item){ modalOpen=false; return; }
    }
    el.modalTitleText.textContent = mode==='edit' ? '編輯項目' : '新增項目';
    el.deleteRow.style.display = mode==='edit' ? 'flex' : 'none';

    const cat = item ? item.cat : state.activeTab;
    setSegActive(el.fCat, cat);
    populateGroupOptions(cat);

    el.fName.value = item ? item.name : '';
    el.fGroup.value = item ? item.group : '';
    setSegActive(el.fStorage, item ? item.storage : 'case');
    el.fMust.classList.toggle('on', item ? !!item.must : false);
    el.fDefault.classList.toggle('on', item ? !!item.isDefault : false);
    updateDefaultHint();
    el.fNote.value = item && item.note ? item.note : '';
    formScenarios = new Set(item ? (item.scenarios||[]) : []);
    bindScenarioChips();

    el.modalOverlay.classList.add('open');
    setTimeout(()=>el.fName.focus(), 50);
  }
  function closeModal(){ modalOpen=false; el.modalOverlay.classList.remove('open'); editingId=null; }

  el.fCat.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    setSegActive(el.fCat, btn.dataset.value);
    populateGroupOptions(btn.dataset.value);
  });
  el.fStorage.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(btn) setSegActive(el.fStorage, btn.dataset.value);
  });
  el.fMust.addEventListener('click', ()=>el.fMust.classList.toggle('on'));
  el.fDefault.addEventListener('click', ()=>{ el.fDefault.classList.toggle('on'); updateDefaultHint(); });
  el.modalClose.addEventListener('click', closeModal);
  el.fCancel.addEventListener('click', closeModal);
  el.modalOverlay.addEventListener('click', e=>{ if(e.target===el.modalOverlay) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modalOpen) closeModal(); });

  el.fSave.addEventListener('click', ()=>{
    const name = el.fName.value.trim();
    if(!name){ el.fName.focus(); return; }
    const cat = getSegActive(el.fCat) || 'adult';
    const group = el.fGroup.value.trim() || DEFAULT_GROUP[cat];
    const storage = getSegActive(el.fStorage) || 'case';
    const must = el.fMust.classList.contains('on');
    const isDefault = el.fDefault.classList.contains('on');
    const note = el.fNote.value.trim() || null;
    const scenarios = Array.from(formScenarios);

    if(modalMode==='edit' && editingId){
      const idx = state.items.findIndex(i=>i.id===editingId);
      if(idx>-1) state.items[idx] = {...state.items[idx], name, cat, group, storage, must, note, scenarios, isDefault};
    }else{
      const maxOrder = state.items.reduce((m,i)=>Math.max(m, i.order||0), 0);
      state.items.push({id:uid(), name, cat, group, storage, must, note, scenarios, isDefault, order:maxOrder+10});
    }
    scheduleSave();
    state.activeTab = cat;
    closeModal();
    render();
  });

  el.fDelete.addEventListener('click', ()=>{
    if(!editingId) return;
    state.items = state.items.filter(i=>i.id!==editingId);
    delete state.packed[editingId];
    scheduleSave();
    closeModal();
    render();
  });

  el.fabAdd.addEventListener('click', ()=>openModal('add'));

  // ---------- Events ----------
  el.tripName.addEventListener('input', ()=>{ state.tripName = el.tripName.value; scheduleSave(); });
  el.tabs.addEventListener('click', e=>{
    const btn = e.target.closest('.tab');
    if(!btn) return;
    state.activeTab = btn.dataset.cat;
    scheduleSaveView();
    render();
  });
  el.mustToggle.addEventListener('click', ()=>{ state.mustOnly=!state.mustOnly; scheduleSaveView(); render(); });
  el.unpackedToggle.addEventListener('click', ()=>{ state.unpackedOnly=!state.unpackedOnly; scheduleSaveView(); render(); });
  el.defaultToggle.addEventListener('click', ()=>{ state.defaultOnly=!state.defaultOnly; scheduleSaveView(); render(); });
  el.groupBySeg.addEventListener('click', e=>{
    const btn = e.target.closest('.seg-btn');
    if(!btn) return;
    state.groupBy = btn.dataset.mode;
    scheduleSaveView();
    render();
  });

  el.list.addEventListener('change', e=>{
    const input = e.target.closest('input[type="checkbox"][data-id]');
    if(!input) return;
    state.packed[input.dataset.id] = input.checked;
    scheduleSave();
    render();
  });
  el.list.addEventListener('click', e=>{
    const editBtn = e.target.closest('[data-edit-id]');
    if(editBtn){ openModal('edit', editBtn.dataset.editId); return; }
    const header = e.target.closest('[data-toggle-key]');
    if(header){
      state.collapsed[header.dataset.toggleKey] = !state.collapsed[header.dataset.toggleKey];
      render();
    }
  });

  function armConfirm(btn, label, confirmLabel, action){
    let armed=false, timer=null;
    btn.addEventListener('click', ()=>{
      if(!armed){
        armed = true;
        btn.textContent = confirmLabel;
        btn.classList.add('confirming');
        timer = setTimeout(()=>{ armed=false; btn.textContent=label; btn.classList.remove('confirming'); }, 3500);
        return;
      }
      clearTimeout(timer);
      armed = false;
      btn.textContent = label;
      btn.classList.remove('confirming');
      action();
    });
  }

  armConfirm(el.resetBtn, '重置打包狀態', '再按一次確認', ()=>{
    state.packed = {}; scheduleSave(); render(); toast('已重置打包狀態');
  });
  armConfirm(el.newTripBtn, '開始新行程', '確認：清掉本次行程項目', ()=>{
    state.items = state.items.filter(i=>i.isDefault);
    state.packed = {}; state.tripName = ''; el.tripName.value = '';
    scheduleSave(); render(); toast('已開始新行程');
  });

  // ---------- 匯出 / 匯入備份 ----------
  el.exportBtn.addEventListener('click', ()=>{
    const payload = {
      v: APP_VERSION, updatedAt: Date.now(),
      items: state.items, packed: state.packed, tripName: state.tripName, seeded: state.seeded,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    const safeName = (state.tripName || '行李清單').replace(/[\\/:*?"<>|]/g,'-');
    a.href = url;
    a.download = `${safeName}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('已匯出備份檔');
  });

  el.importBtn.addEventListener('click', ()=>el.importFile.click());
  el.importFile.addEventListener('change', e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.items)) throw new Error('格式不符');
        const m = migrate(data);
        state.items = m.items;
        state.packed = m.packed;
        state.tripName = m.tripName;
        state.seeded = m.seeded;
        el.tripName.value = state.tripName;
        scheduleSave();
        render();
        toast(`已匯入 ${m.items.length} 個項目`);
      }catch(err){
        toast('匯入失敗：檔案格式不正確');
      }
      el.importFile.value = '';
    };
    reader.onerror = ()=>{ toast('讀取檔案失敗'); el.importFile.value=''; };
    reader.readAsText(file);
  });

  // ---------- 共同編輯：輪詢同步（僅 cloud / artifact 模式有意義）----------
  async function pollShared(){
    if(modalOpen) return;
    if(Store.mode!=='cloud' && Store.mode!=='artifact') return;
    try{
      const data = await Store.readShared();
      if(!data) return;
      const remoteAt = typeof data.updatedAt==='number' ? data.updatedAt : 0;
      if(remoteAt <= state.updatedAt) { renderStorageBox(); return; }
      const m = migrate(data);
      state.items = m.items;
      state.packed = m.packed;
      state.seeded = m.seeded;
      state.updatedAt = remoteAt;
      if(document.activeElement !== el.tripName){
        state.tripName = m.tripName;
        el.tripName.value = m.tripName;
      }
      render();
    }catch(e){}
  }
  setInterval(pollShared, 7000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') pollShared();
  });

  // ---------- Init ----------
  async function init(){
    el.versionTag.textContent = 'v'+APP_VERSION;
    Store.detect();

    const view = await Store.readView();
    if(view){
      if(view.activeTab) state.activeTab = view.activeTab;
      if(Array.isArray(view.scenarios)) state.scenarios = new Set(view.scenarios);
      if(typeof view.mustOnly==='boolean') state.mustOnly = view.mustOnly;
      if(typeof view.unpackedOnly==='boolean') state.unpackedOnly = view.unpackedOnly;
      if(typeof view.defaultOnly==='boolean') state.defaultOnly = view.defaultOnly;
      if(view.groupBy) state.groupBy = view.groupBy;
    }

    const shared = await Store.readShared();
    if(shared && Array.isArray(shared.items) && shared.items.length>0){
      const m = migrate(shared);
      state.items = m.items;
      state.packed = m.packed;
      state.tripName = m.tripName;
      state.seeded = m.seeded;
      state.updatedAt = m.updatedAt;
      if(m.added>0 || m.dataVersion!==APP_VERSION) await doSave();
      if(m.added>0) toast(`已升級到 v${APP_VERSION}，補上 ${m.added} 個新預設項目`);
    }else{
      state.items = BASELINE.map(baselineItem);
      state.seeded = BASELINE.map(b=>b.id);
      await doSave();
    }

    el.tripName.value = state.tripName || '';
    render();
  }
  init();

})();
</script>
</body>
</html>
